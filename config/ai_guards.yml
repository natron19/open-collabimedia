# Per-app guardrail configuration, read by AiGuardConfig.
# See docs/ai-guardrails.md (Layer 1b: AiOutputGuard) and docs/ai-evals.md.

# Product marketing copy; personal distress is out of scope.
crisis_terms: []

# Output structure rules per AiTemplate name. Templates not listed get the
# generic output checks only (non-empty, no prompt leak, no profanity, no new PII).
#   format:        text | json
#   required_keys: top-level keys the JSON object must contain
templates:
  health_ping:
    format: text
  # ContentPackagesController#create reads all six keys and ContentPackage
  # validates presence of each, so a package missing any of them cannot be saved.
  collabimedia_content_package_v1:
    format: json
    required_keys: [linkedin_post, twitter_hook, email_subject, email_preview, promo_hook, community_question]
